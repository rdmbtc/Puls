name: puls
description: Premium prediction-market Flutter UI prototype with mock data.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  animate_do: ^3.3.4
  fl_chart: ^1.2.0
  flex_color_scheme: ^8.4.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  http: ^1.2.2
  supabase_flutter: ^2.8.4
  lottie: ^3.3.1
  video_player: ^2.9.2
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.1
  web: ^1.1.1
  haptic_kit: ^1.0.0
  picons: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/video/
    - assets/logo.png
