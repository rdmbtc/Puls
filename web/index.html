  <!-- WalletConnect JS Bridge for Flutter -->
  <script>
    // Arc Testnet chain config
    const ARC_TESTNET = {
      chainId: 5042002,
      chainIdHex: '0x4CEF52',
      name: 'Arc Testnet',
      rpcUrl: 'https://84-22-148-57.sslip.io/api/rpc-proxy',
      explorerUrl: 'https://testnet.arcscan.app',
      currencySymbol: 'USDC',
      currencyDecimals: 18,
    };

    // State
    window._walletAddress = null;
    window._walletProvider = null;

    // Connect via browser wallet (MetaMask, etc.)
    window.connectBrowserWallet = async function() {
      try {
        if (!window.ethereum) {
          return JSON.stringify({ error: 'No browser wallet found. Please install MetaMask.' });
        }
        const provider = new ethers.BrowserProvider(window.ethereum);
        const accounts = await provider.send('eth_requestAccounts', []);
        if (!accounts || accounts.length === 0) {
          return JSON.stringify({ error: 'No accounts found' });
        }

        // Try to switch to Arc Testnet
        try {
          await window.ethereum.request({
            method: 'wallet_switchEthereumChain',
            params: [{ chainId: ARC_TESTNET.chainIdHex }],
          });
        } catch (switchError) {
          // Chain not added — add it
          if (switchError.code === 4902) {
            await window.ethereum.request({
              method: 'wallet_addEthereumChain',
              params: [{
                chainId: ARC_TESTNET.chainIdHex,
                chainName: ARC_TESTNET.name,
                rpcUrls: [ARC_TESTNET.rpcUrl],
                blockExplorerUrls: [ARC_TESTNET.explorerUrl],
                nativeCurrency: {
                  name: ARC_TESTNET.currencySymbol,
                  symbol: ARC_TESTNET.currencySymbol,
                  decimals: ARC_TESTNET.currencyDecimals,
                },
              }],
            });
          } else {
            // User rejected the switch, or it otherwise failed — don't report a false success.
            return JSON.stringify({ error: 'Please switch MetaMask to Arc Testnet to continue.' });
          }
        }

        // Confirm we actually ended up on Arc Testnet before reporting success.
        const net = await provider.getNetwork();
        if (Number(net.chainId) !== ARC_TESTNET.chainId) {
          return JSON.stringify({ error: 'Wrong network. Please switch MetaMask to Arc Testnet (Chain ID 5042002).' });
        }

        window._walletAddress = accounts[0];
        window._walletProvider = provider;
        window._walletSigner = await provider.getSigner();

        // Listen for account changes
        window.ethereum.on('accountsChanged', async function(newAccounts) {
          window._walletAddress = newAccounts.length > 0 ? newAccounts[0] : null;
          if (newAccounts.length > 0) {
            try {
              window._walletSigner = await window._walletProvider.getSigner();
            } catch (err) {
              window._walletSigner = null;
            }
          } else {
            window._walletSigner = null;
          }
          if (window._onWalletChanged) window._onWalletChanged(window._walletAddress);
        });

        // Re-validate / refresh signer when the user switches network in MetaMask.
        window.ethereum.on('chainChanged', async function() {
          try {
            window._walletProvider = new ethers.BrowserProvider(window.ethereum);
            window._walletSigner = await window._walletProvider.getSigner();
          } catch (err) {
            window._walletSigner = null;
          }
        });

        return JSON.stringify({ address: accounts[0] });
      } catch (e) {
        return JSON.stringify({ error: e.message || 'Connection failed' });
      }
    };

    // Disconnect
    window.disconnectBrowserWallet = function() {
      window._walletAddress = null;
      window._walletProvider = null;
      window._walletSigner = null;
      return JSON.stringify({ success: true });
    };

    // Get current address
    window.getBrowserWalletAddress = function() {
      return window._walletAddress || '';
    };

    // Check if browser wallet is available
    window.hasBrowserWallet = function() {
      return !!window.ethereum;
    };

    // On-chain interaction config
    const USDC_ADDRESS = '0x3600000000000000000000000000000000000000';
    const USDC_ABI = [
      'function allowance(address owner, address spender) view returns (uint256)',
      'function approve(address spender, uint256 amount) returns (bool)'
    ];
    const MARKET_ABI = [
      'function buyYes(uint256 amount)',
      'function buyNo(uint256 amount)',
      'function sellYes(uint256 shares)',
      'function sellNo(uint256 shares)',
      'function claim()'
    ];

    // Helper to get signer instantly (cached or fresh)
    async function getSigner() {
      if (!window.ethereum) throw new Error('No browser wallet found.');
      if (!window._walletProvider) window._walletProvider = new ethers.BrowserProvider(window.ethereum);
      // Guard: every tx must run on Arc Testnet, even if the user switched network mid-session.
      const net = await window._walletProvider.getNetwork();
      if (Number(net.chainId) !== ARC_TESTNET.chainId) {
        throw new Error('Wrong network. Please switch MetaMask to Arc Testnet (Chain ID 5042002).');
      }
      if (!window._walletSigner) window._walletSigner = await window._walletProvider.getSigner();
      return window._walletSigner;
    }

    window.buyPositionOnChain = async function(isYes, amountUsdc, contractAddress) {
      try {
        const signer = await getSigner();
        const userAddr = await signer.getAddress();

        // Convert amount to micro USDC (6 decimals)
        const amountMicro = Math.round(parseFloat(amountUsdc) * 1000000);
        const amountBigInt = BigInt(amountMicro);

        // Check allowance
        const usdc = new ethers.Contract(USDC_ADDRESS, USDC_ABI, signer);
        const allowance = await usdc.allowance(userAddr, contractAddress);
        if (allowance < amountBigInt) {
          // Approve max
          const approveTx = await usdc.approve(contractAddress, ethers.MaxUint256);
          await approveTx.wait();
        }

        // Call market contract
        const market = new ethers.Contract(contractAddress, MARKET_ABI, signer);
        const method = isYes ? 'buyYes' : 'buyNo';
        const tx = await market[method](amountBigInt);
        await tx.wait(); // revert here instead of recording a phantom trade
        return JSON.stringify({ txHash: tx.hash });
      } catch (e) {
        return JSON.stringify({ error: e.message || 'Transaction failed' });
      }
    };

    window.sellPositionOnChain = async function(isYes, shares, contractAddress) {
      try {
        const signer = await getSigner();

        const sharesMicro = Math.round(parseFloat(shares) * 1000000);
        const sharesBigInt = BigInt(sharesMicro);

        const market = new ethers.Contract(contractAddress, MARKET_ABI, signer);
        const method = isYes ? 'sellYes' : 'sellNo';
        const tx = await market[method](sharesBigInt);
        await tx.wait(); // revert here instead of recording a phantom trade
        return JSON.stringify({ txHash: tx.hash });
      } catch (e) {
        return JSON.stringify({ error: e.message || 'Transaction failed' });
      }
    };

    window.claimOnChain = async function(contractAddress) {
      try {
        const signer = await getSigner();

        const market = new ethers.Contract(contractAddress, MARKET_ABI, signer);
        const tx = await market.claim();
        await tx.wait(); // revert here instead of recording a phantom claim
        return JSON.stringify({ txHash: tx.hash });
      } catch (e) {
        return JSON.stringify({ error: e.message || 'Transaction failed' });
      }
    };
  </script>
