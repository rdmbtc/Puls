  <style>
    :root{
      --bg:#070912;
      --bg2:#0B0F1E;
      --surface:#0F1424;
      --surface2:#131A2E;
      --text:#EAF0FF;
      --muted:#9AA6C0;
      --dim:#6B7590;
      --border:#1E263C;
      --border2:#2A3450;
      --pink:#EC4899;
      --pink-soft:rgba(236,72,153,.12);
      --pink-line:rgba(236,72,153,.32);
      --mint:#2DD4BF;
      --mint-soft:rgba(45,212,191,.10);
      --mint-line:rgba(45,212,191,.30);
      --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
      --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    a{color:inherit;text-decoration:none}
    ::selection{background:var(--pink);color:#fff}

    
    }), { threshold: .12 });
    document.querySelectorAll('.reveal').forEach((el, i) => {
      el.style.transitionDelay = (i % 3 * 70) + 'ms';
      io.observe(el);
    });

    // animated swipe demo in the phone
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const deck = document.getElementById('deck');
      if (!deck) return;
      let dir = 1; // 1 = yes (right), -1 = no (left)
      setInterval(() => {
        const cards = [...deck.querySelectorAll('.card')];
        const top = cards.find(c => c.dataset.pos === '0');
        if (!top) return;
        const btn = top.querySelector(dir === 1 ? '.yes' : '.no');
        btn.classList.add('hot');
        setTimeout(() => {
          top.classList.add(dir === 1 ? 'out-yes' : 'out-no');
          cards.forEach(c => {
            if (c === top) return;
            c.dataset.pos = String(Number(c.dataset.pos) - 1);
          });
          setTimeout(() => {
            btn.classList.remove('hot');
            top.classList.remove('out-yes', 'out-no');
            top.dataset.pos = '2';
            deck.prepend(top);
          }, 600);
        }, 700);
        dir *= -1;
      }, 3400);
    })();

    // show the latest release tag on the button
    fetch('https://api.github.com/repos/rdmbtc/Puls/releases/latest').then(r => r.json()).then(d => {
      if (d && d.tag_name) {
        document.getElementById('ver').textContent = d.tag_name + ' · Arc Testnet';
        const a = d.assets && d.assets.find(x => /\.apk$/i.test(x.name));
        if (a && a.browser_download_url) { document.getElementById('apk').href = a.browser_download_url; }
      }
    }).catch(() => {});
  </script>
  <script defer src="/nav.js"></script>
</body>
</html>
